# SonarQube Cloud analysis workflow

name: SonarQube analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Java 17 for SonarQube Scanner
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Setup PHP for running tests
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          coverage: none

      # Run unit tests and generate coverage report
      - name: Run unit tests and generate coverage report
        run: php tests/run-tests.php

      # SonarQube Cloud analysis
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=abhishekelsner_new-elsner
            -Dsonar.organization=abhishekelsner
            -Dsonar.exclusions=tests/**,test
            -Dsonar.coverage.exclusions=tests/**
            -Dsonar.php.coverage.reportPaths=reports/coverage.xml,coverage.xml

